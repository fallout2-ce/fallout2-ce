name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/codeql.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'third_party/**'
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - '.github/workflows/codeql.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'third_party/**'
  schedule:
    - cron: '34 3 * * 1'

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  analyze-c-cpp:
    name: Analyze (c-cpp)
    runs-on: ubuntu-22.04

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt update
          sudo apt install libsdl2-dev zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure
        run: cmake --preset linux-x64-debug

      - name: Build
        run: cmake --build --preset linux-x64-debug --parallel $(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
