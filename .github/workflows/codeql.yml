name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/codeql.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'third_party/**'
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - '.github/workflows/codeql.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'third_party/**'
  schedule:
    - cron: '34 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: none
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Dependencies
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt update
          sudo apt install -y libsdl2-dev zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          trap-caching: false

      - name: Configure
        if: matrix.language == 'c-cpp'
        run: cmake --preset linux-x64-debug

      - name: Build
        if: matrix.language == 'c-cpp'
        run: cmake --build --preset linux-x64-debug --parallel $(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
