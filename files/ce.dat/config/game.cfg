;
; Game general config
;
; Fallout 2
;

[start]
; Starting year, month, day. Month and day are 0-indexed (0 = January, 0 = first day of month).
year=2241
month=6
day=24
; Starting game time in 24-hour HHMM format. Default 824 is 8:24 AM.
time=824
; To start a new game somewhere other than artemple.map, set this to the map file name.
map=
; Starting worldmap marker position. -1 uses the starting map's world area.
worldmap_x=-1
worldmap_y=-1
; Starting worldmap viewport position. -1 uses the default upper-left view.
worldmap_view_x=-1
worldmap_view_y=-1
; Starting (tribal) and default (jumpsuit) player models. Can also be changed in-game via script.
model_male=hmwarr
model_male_default=hmjmps
model_female=hfprim
model_female_default=hfjmps
; Set to 1 if you want the pipboy to be available at the start of the game.
; Set to 2 to make the pipboy available by only skipping the vault suit movie check.
pipboy=0

[maps]
; Set to 1 to apply transition tile, elevation, and rotation overrides on all maps,
; including Fallout 2 map IDs 19 and 37.
disable_special_map_ids=0

[karma]
; FRM numbers for karma icons on the character screen. Number of points entries should be 1 less than number of frms entries.
; Example: frms=47,48,49  points=-100,100
frms=
points=

[items]
; Proto IDs for healing items.
stimpak=40
super_stimpak=144
healing_powder=273

[dialog]
; Set to 1 to prevent using 0 to escape from dialogue at any time.
no_exit_hotkey=1
; Set to 1 to allow using '^' in dialog msg files to specify gender-based alternative text.
; Text must be enclosed in angle brackets, e.g. <MaleText^FemaleText>.
gender_words=0
; Set to 1 to enable the sfall StartGDialogFix behavior: talking-head dialogs honor the start_gdialog mood argument unless it is -1.
; When set to 0, CE still applies sfall's crash fix for calling start_gdialog outside talk_p_proc.
start_gdialog_fix=0

[misc]
; Custom title for the OS window in windowed mode. Falls back to version_string when empty.
window_title=

[main_menu]
; Custom version string shown on the main menu. Supports up to two %d placeholders for the game version numbers.
; Example: FALLOUT II v1.02d
version_string=
; Font color for the version string and copyright text. Last byte picks the color (default 0x3C).
; First byte flags: 1 - version string only, 2 - underline, 4 - monospace font.
; Example: 0x000055
font_color=0
; Font color for the main menu button text.
big_font_color=0
; Pixel offset for main menu buttons.
offset_x=0
offset_y=0
; Set to 1 to scale the high resolution main menu button panel, red buttons, and button labels.
scale_buttons_and_text=0
; Pixel offset for the high resolution main menu button panel.
main_menu_panel_offset_x=16
main_menu_panel_offset_y=15
; Pixel offset for the copyright text line.
credits_offset_x=0
credits_offset_y=0

[sound]
; Background music played on the main menu.
main_menu_music=07desert
; Background music played while viewing the world map on foot or in the car.
worldmap_music=23world
worldmap_car_music=20car
; Music played before and during the end-game credits/movie sequence.
endgame_movie_music0=akiss
endgame_movie_music1=10labone
; Music file played as looping ambience while maps are loading.
map_loading_sound=wind2

[movies]
; Overrides for game movie file names in art\cuts\. These correspond to sfall's Movie1 through Movie32 settings.
; Movie IDs used by scripts are 0-indexed, so movie1 is script movie ID 0.
movie1=iplogo.mve
movie2=intro.mve
movie3=elder.mve
movie4=vsuit.mve
movie5=afailed.mve
movie6=adestroy.mve
movie7=car.mve
movie8=cartucci.mve
movie9=timeout.mve
movie10=tanker.mve
movie11=enclave.mve
movie12=derrick.mve
movie13=artimer1.mve
movie14=artimer2.mve
movie15=artimer3.mve
movie16=artimer4.mve
movie17=credits.mve
; Additional script-playable movies.
movie18=
movie19=
movie20=
movie21=
movie22=
movie23=
movie24=
movie25=
movie26=
movie27=
movie28=
movie29=
movie30=
movie31=
movie32=
; Set to 0 to skip the automatic final credits sequence after the endgame slideshow.
; The endgame_movie script function still plays the configured sequence.
endgame_play_after_slideshow=1
; Optional pre-credit movie IDs for the endgame_movie script function. IDs are 0-indexed.
; Set to -1 for no pre-credit movie. Fallout 1 style uses 10 for male and 11 for female.
endgame_movie_male=-1
endgame_movie_female=-1
; Credits text file opened by the endgame_movie script function. Set empty to skip credits.
endgame_credits_file=credits.txt
; Number of days after game start when each Hakunin dream sequence becomes available.
artimer1=90
artimer2=180
artimer3=270
artimer4=360

[stats]
; Comma-separated XP thresholds for custom player levels. First value is level 2, second is level 3, etc.
; Player level is capped once the highest specified level is reached.
; Example: xp_table=50,100,200
xp_table=

[combat]
; AP cost for accessing inventory in combat.
inventory_ap_cost=4
; AP cost reduction per Quick Pockets perk rank.
quick_pockets_ap_cost_reduction=2
; Damage formula used to calculate combat damage.
; 0 - Fallout default, 1 - Glovz's Damage Fix, 2 - Glovz's Damage Fix with Damage Multiplier tweak, 5 - Haenlomal's Yet Another Ammo Mod
; Don't change this unless another mod explicitly requires it.
damage_formula=0
; Set to 1 to fix the bug that caused bonus HtH damage to not be applied correctly.
bonus_hth_damage_fix=1
; Set to 1 to remove the time limits that prevent critical hits/misses in the first few days of the game.
remove_critical_time_limits=0
; Set to 1 to allow science and repair to be used on the player, or 2 for all critters (rather than only brahmin/robots).
science_on_critters=0
; Set to 1 to make pre-attack ammo checks respect weapon ammo cost and HOOK_AMMOCOST type 1 overrides.
; Set to 0 to preserve vanilla behavior where one loaded round is enough to attempt the attack.
check_weapon_ammo_cost=1
; Set to 1 to enable modified burst bullet distribution (spray mod).
burst_enabled=0
; Ratio of bullets going to the center group vs. left/right in burst attacks. Multiplier is capped at divisor.
burst_center_mult=1
burst_center_div=3
; Ratio of center-group bullets that target the primary target directly. Multiplier is capped at divisor.
burst_target_mult=1
burst_target_div=2

[explosions]
; Set to 1 to make explosions and projectiles emit light.
emit_light=0
; Dynamite damage range. Max is capped at 9999; min is capped at max.
dynamite_max=50
dynamite_min=30
; Plastic explosive damage range. Max is capped at 9999; min is capped at max.
plastic_explosive_max=80
plastic_explosive_min=40

[skilldex]
; FRM numbers for Skilldex skill cursors. Default is 293 for all skills.
lockpick=293
steal=293
traps=293
first_aid=293
doctor=293
science=293
repair=293

[worldmap]
; Set to 1 to prevent using number keys to enter unvisited areas on a town map.
town_map_hotkeys_fix=1
; Milliseconds between world map travel updates (1-150). Set to 0 to update every rendered frame.
travel_delay=0
; Set to 1 to show travel markers on the world map, or 2 to show only when sneaking.
trail_markers=0
; Set to 1 to show the current terrain name when hovering over the stopped party marker.
terrain_info=0
; Set to 1 to skip the encounter with Frank Horrigan.
disable_horrigan=0
; City reputation overrides. Syntax: city_id:global_id pairs separated by commas.
; Example: 0:5001,2:5003,3:5004
city_reputation_list=

[characters]
; Custom premade characters for the character selection screen.
; premade_paths is a comma-separated list of file names (max 11 chars each) in the premade\ folder, without extension.
; premade_fids is a comma-separated list of FRM numbers for the character portrait, matching the order of premade_paths.
; Example: premade_paths=combat,diplomat,stealth   premade_fids=201,203,202
premade_paths=
premade_fids=

[text]
; Comma-separated list of extra game message file names (without .msg extension) to load from the game\ folder.
; Use 'filename:number' syntax to assign explicit IDs. Access via message_str_game script function.
extra_msg_file_list=
