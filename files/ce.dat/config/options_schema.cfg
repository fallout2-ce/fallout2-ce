; CE Options Schema
; Defines metadata for settings displayed in the Options menu.
; Section headers use [ini_section.key] format.
; label_id / desc_id are message IDs from data/text/english/game/options.msg (future).
; vanilla = original Fallout 2 value (omit if CE-only with no vanilla equivalent).

; ---------------------------------------------------------------------------
; SCREEN
; ---------------------------------------------------------------------------

[screen.resolution_x]
type=int
category=display
default=640
vanilla=640
label=Resolution X
apply=restart

[screen.resolution_y]
type=int
category=display
default=480
vanilla=480
label=Resolution Y
apply=restart

[screen.windowed]
type=choice
category=display
default=0
vanilla=0
label=Window Mode
choices=0:Fullscreen, 1:Windowed, 2:Borderless
apply=restart

[screen.mouse_lock]
type=bool
category=display
default=false
label=Lock Mouse to Window

[screen.scale]
type=int
category=display
default=1
vanilla=1
label=Scale
apply=restart

